name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aynı dal için yalnızca EN SON CI çalışması koşar (eskisi iptal edilir) —
# Sık push'ta kuyruk/limit birikmesini ve gereksiz build maliyetini azaltır.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # Build, gerçek servislere bağlanmadan çalışır: tüm okumalar lazy
    # (fonksiyon içinde). Yalnız Clerk build anında publishable key ister —
    # placeholder yeterli, gizli anahtar kullanılmaz.
    #
    # 2026-09-12 — CI publishable key'i İKİ koşulu birlikte sağlamalı:
    #  1) FORMAT geçerli: Clerk `parsePublishableKey` `key.split('_').length === 3`
    #     bekler, base64 parçasını decode edip `$` ile biten bir host bulmalı.
    #     (`pk_test_ci_placeholder` bunu geçmez → middleware her istekte hata atar,
    #     server ayağa kalkmaz, e2e webServer 120s'de timeout olur.)
    #  2) `pk_live_` OLMALI: dev instance anahtarı (`pk_test_`) middleware'i her
    #     istekte "dev browser handshake"ine zorlar; tarayıcı
    #     `<frontendApi>/v1/client/handshake`'e gider ve sahte instance 400
    #     döndüğü için sayfa gövdesi Clerk JSON'u olarak kalır (h1 yok).
    #     Production instance yolu handshake yapmaz → public sayfalar normal render.
    # Aşağıdaki anahtar, `placeholder.clerk.accounts.dev$`'in base64'üdür.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_cGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA
      CLERK_SECRET_KEY: sk_live_ci_placeholder
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # 2026-09-12 (kod incelemesi #8) — Playwright E2E artık CI'da.
  #
  # Neden koşullu: smoke/a11y spec'leri GERÇEK, seed'li bir veritabanı ister
  # (`/api/posts`, `/portal` board okur; board yoksa /portal redirect döngüsüne
  # girer). Auth testleri Clerk test env'i olmadığında KENDİNİ ATLAR
  # (e2e/auth-helpers.ts → isAuthConfigured), bu yüzden gizli Clerk anahtarı
  # gerekmez. Tek gereken DATABASE_URL'dir.
  #
  # Bu secret tanımlı değilse job YEŞİL ve no-op kalır (ilk adım bilgi notu
  # basar); tanımlandığında seed + build + e2e koşar. Test için AYRI bir Neon
  # branch kullanın — seed yazar, üretim DB'sine karşı koşmayın.
  #
  # Secret ekleme: GitHub → Settings → Secrets and variables → Actions →
  # New repository secret → DATABASE_URL.
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Format geçerli, instance SAHTE — `pk_live_` bilinçli (yukarıdaki nota bakın).
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_cGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA
      CLERK_SECRET_KEY: sk_live_ci_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: E2E veritabanı yapılandırıldı mı?
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice title=E2E atlandı::DATABASE_URL secret'ı tanımlı değil; e2e adımları atlanıyor."
          else
            echo "E2E koşacak."
          fi
      - if: env.DATABASE_URL != ''
        run: npm ci
      - if: env.DATABASE_URL != ''
        run: node tools/seed-e2e.mjs
      - if: env.DATABASE_URL != ''
        run: npx playwright install --with-deps chromium
      - if: env.DATABASE_URL != ''
        run: npm run build
      # Sprint 71.1 — DB-backed entegrasyon testleri (gerçek şemaya karşı SQL).
      # Aynı ayrı Neon branch'ine yazar ve kendi fikstürünü temizler. Build'den
      # ÖNCE koşar: seed edilmiş şemayı kullanır, uygulamayı ayağa kaldırmaz.
      - if: env.DATABASE_URL != ''
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: env.DATABASE_URL != ''
        run: npm run test:e2e
