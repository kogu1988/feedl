name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aynı dal için yalnızca EN SON CI çalışması koşar (eskisi iptal edilir) —
# Sık push'ta kuyruk/limit birikmesini ve gereksiz build maliyetini azaltır.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # Build, gerçek servislere bağlanmadan çalışır: tüm okumalar lazy
    # (fonksiyon içinde). Yalnız Clerk build anında publishable key ister —
    # placeholder yeterli, gizli anahtar kullanılmaz.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
