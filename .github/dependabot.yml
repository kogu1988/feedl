version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Dependabot güvenlik uyarılarının bir kısmı feedl WEB SÜRÜMÜNDE KULLANILMAYAN
    # derin transitif bağımlılıklardan gelir: @clerk/ui → react-native / metro /
    # @solana (Clerk'in mobil/native UI desteği). Bunlar Next.js tarafından
    # tree-shake edilir (app/e koda import edilmez) ve üretim bundle'ında YOKTUR.
    # Bunları zorla yükseltmek (major) metro/jayson API'sini kırar. Bu yüzden
    # ignore edilir; web'e etkisi yoktur (DoS bildirimleri dev/tooling'dir).
    ignore:
      - dependency-name: "image-size"
      - dependency-name: "stream-json"
      - dependency-name: "jayson"
      - dependency-name: "metro"
      - dependency-name: "metro-config"
      - dependency-name: "metro-transform-worker"
      - dependency-name: "react-native"
      - dependency-name: "@react-native/*"
      - dependency-name: "@solana/*"
      - dependency-name: "@solana-mobile/*"
      # React sürümleri PROJEDE TAM SABİTTİR (19.2.8; react ve react-dom aynı
      # sürümde tutulur — SKILL.md "pinned exactly" kuralı) çünkü Next 15.5
      # hattı buna göre doğrulanmıştır. Major/minor önerileri Next ile
      # uyumsuzluğa yol açabilir; yalnız patch açık kalır.
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # eslint-config-next MAJOR'ı Next.js major'ına bağlıdır: 16.x, Next 16
      # ister. Next 15.5'te alınamaz (CI kırmızı kalıyordu). Patch/minor açık.
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        # 15.5 hattı kilitli: minor da hattın dışına çıkarır, yalnız patch açık.
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # vite 8 rolldown'a geçti; platforma özel native binding npm'in bilinen
      # optional-dependency hatasıyla (npm/cli#4828) Windows'ta KURULMAZ ve
      # yerel `vitest` "Cannot find native binding" ile hiç başlamaz. CI (Linux)
      # yeşil kalıyordu, yani yeşil CI bu kırılmayı GİZLEDİ (2026-09-13'te
      # yaşandı ve vite 6.4.3'e geri dönüldü). Vite major'ı açık kalmasın.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # 2026-09-14 triyajı — kapatılan Dependabot PR'ları geri açılmasın.
      # svix 2.4.0 Node >= 22 ister; CI ve üretim Node 20'de çalışır. Node
      # 20 -> 22 yükseltmesi yapılana kadar minor/major kapalı (patch açık).
      - dependency-name: "svix"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # typescript major'ı (5 -> 7) kırıcı ve CI'da kırmızı: planlı yükseltme ister.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vitest major'ı (4 -> 5) runner/config yüzeyini değiştirir ve CI kırmızı.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
